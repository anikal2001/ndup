[project]
name = "ndup"
version = "0.1.0"
description = "Notion semantic duplication detector. Local embeddings only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "numpy>=1.26",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "datasketch>=1.6",
  "prometheus-client>=0.20",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
gpu = ["sentence-transformers>=3.0"]
client = ["typer>=0.12", "httpx>=0.27", "rich>=13"]

[project.scripts]
ndup = "ndup.cli.main:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ndup = ["py.typed", "db/*.sql", "db/migrations/*.sql", "db/queries/*.sql"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: fast tests without external services",
  "integration: Postgres 17 and pgvector 0.8",
  "e2e: live Notion workspace",
  "scale: large synthetic run",
  "quality: golden-set detection metrics",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ndup/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ndup"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "datasketch.*",
  "prometheus_client.*",
  "pgvector.*",
  "sentence_transformers.*",
  "fasttext",
  "keyring",
  "networkx",
  "networkx.*",
  "sklearn",
  "sklearn.*",
]
ignore_missing_imports = true
