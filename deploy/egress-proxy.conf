# Tinyproxy allow-list. The egress container is the only one with internet.
# Notion is the sync target. Hugging Face is absent: embeddings are local.

Port 8888
Timeout 600
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

ConnectPort 443
FilterDefaultDeny Yes
FilterURLs On
Filter "/etc/tinyproxy/filter"
# filter file contents:
# api.notion.com
